[package]
name = "forge"
version = "0.1.0"
edition = "2024"
description = "A fast, extensible command-line toolkit."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
